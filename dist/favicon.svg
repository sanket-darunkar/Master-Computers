<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff2200"/>
      <stop offset="100%" stop-color="#cc0000"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#e65c00"/>
    </linearGradient>
  </defs>

  <!-- White circle background -->
  <circle cx="32" cy="32" r="31" fill="url(#bg)" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Monitor body -->
  <rect x="12" y="20" width="40" height="26" rx="3" fill="url(#red)"/>
  <!-- Screen -->
  <rect x="16" y="23" width="32" height="19" rx="2" fill="#0c0c1e"/>
  <!-- Screen glow lines -->
  <rect x="19" y="27" width="14" height="3" rx="1.5" fill="#ff6600" opacity="0.9"/>
  <rect x="19" y="33" width="26" height="1.5" rx="0.75" fill="#ffffff" opacity="0.3"/>
  <rect x="19" y="36" width="20" height="1.5" rx="0.75" fill="#ffffff" opacity="0.25"/>
  <!-- Stand -->
  <rect x="28" y="46" width="8" height="5" rx="1.5" fill="#aa0000"/>
  <rect x="22" y="50" width="20" height="4" rx="2" fill="#880000"/>

  <!-- Graduation cap (simplified, top-left of screen) -->
  <ellipse cx="26" cy="16" rx="7" ry="2.5" fill="url(#red)"/>
  <rect x="23" y="13" width="6" height="4" rx="1.5" fill="#cc0000"/>
  <!-- Cap tassel -->
  <line x1="33" y1="16" x2="35" y2="20" stroke="#ffb300" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="35" cy="21" r="1.5" fill="#ffb300"/>

  <!-- Globe (top-right) -->
  <circle cx="47" cy="15" r="8" fill="url(#orange)"/>
  <!-- Globe meridian lines -->
  <ellipse cx="47" cy="15" rx="8" ry="3.5" fill="none" stroke="white" stroke-width="0.7" opacity="0.5"/>
  <ellipse cx="47" cy="15" rx="4" ry="8" fill="none" stroke="white" stroke-width="0.7" opacity="0.5"/>
  <line x1="39" y1="15" x2="55" y2="15" stroke="white" stroke-width="0.7" opacity="0.4"/>
  <!-- Continent highlight -->
  <path d="M 44 10 C 46 8, 50 9, 51 11 C 52 13, 50 15, 48 14 C 46 13, 43 12, 44 10 Z" fill="white" opacity="0.5"/>
</svg>
