<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" width="1100" height="340">
  <defs>
    <!-- Red gradient: MASTER -->
    <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#ff2200"/>
      <stop offset="50%"  stop-color="#dd1100"/>
      <stop offset="100%" stop-color="#990000"/>
    </linearGradient>

    <!-- Orange gradient: COMPUTER ACADEMY -->
    <linearGradient id="gOrange" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#e65c00"/>
    </linearGradient>

    <!-- Globe -->
    <linearGradient id="gGlobe" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#ffd740"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>

    <!-- Figure / body -->
    <linearGradient id="gFig" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>

    <!-- Monitor -->
    <linearGradient id="gMon" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#ff3300"/>
      <stop offset="100%" stop-color="#880000"/>
    </linearGradient>

    <!-- Swoosh -->
    <linearGradient id="gSwoosh" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#ff2200"/>
      <stop offset="65%"  stop-color="#cc1100"/>
      <stop offset="100%" stop-color="#ff7700" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Mouse / cable -->
    <linearGradient id="gMouse" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#ffd740"/>
      <stop offset="100%" stop-color="#e65c00"/>
    </linearGradient>

    <filter id="fDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000035"/>
    </filter>
    <filter id="fText" x="-3%" y="-8%" width="106%" height="125%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000028"/>
    </filter>
  </defs>

  <!-- ══════════════════════════════════════════════════════ -->
  <!--  SWOOSH  (left decorative crescent)                  -->
  <!-- ══════════════════════════════════════════════════════ -->
  <path d="M 228 308
           C 52 270, -12 152, 92 52
           C 128 12, 174 -2, 208 3
           C 177 18, 146 50, 140 94
           C 126 164, 166 224, 228 265 Z"
        fill="url(#gSwoosh)"/>
  <path d="M 213 292
           C 68 254, 26 155, 106 70
           C 133 40, 162 24, 188 22
           C 161 38, 138 70, 138 107
           C 132 160, 163 213, 213 250 Z"
        fill="none" stroke="#ff8800" stroke-width="2" opacity="0.30"/>

  <!-- ══════════════════════════════════════════════════════ -->
  <!--  MONITOR                                             -->
  <!-- ══════════════════════════════════════════════════════ -->
  <rect x="93" y="156" width="154" height="114" rx="8" fill="url(#gMon)" filter="url(#fDrop)"/>
  <rect x="101" y="163" width="138" height="98"  rx="5" fill="#1a0000"/>
  <rect x="104" y="166" width="132" height="92"  rx="3" fill="#0c0c1e"/>
  <!-- Screen decoration -->
  <rect x="112" y="175" width="58" height="6" rx="3" fill="#ff6600" opacity="0.85"/>
  <rect x="112" y="186" width="106" height="3" rx="1.5" fill="#fff" opacity="0.22"/>
  <rect x="112" y="193" width="86"  height="3" rx="1.5" fill="#fff" opacity="0.22"/>
  <rect x="112" y="200" width="96"  height="3" rx="1.5" fill="#fff" opacity="0.22"/>
  <rect x="112" y="207" width="58"  height="3" rx="1.5" fill="#ff9800" opacity="0.5"/>
  <rect x="112" y="214" width="80"  height="3" rx="1.5" fill="#fff" opacity="0.18"/>
  <rect x="112" y="221" width="42"  height="3" rx="1.5" fill="#ff6600" opacity="0.38"/>
  <!-- Cursor arrow -->
  <polygon points="147,228 147,247 152,241 156,250 159,249 155,241 162,241"
           fill="#cc0000" opacity="0.88"/>
  <!-- Stand -->
  <rect x="162" y="270" width="16" height="20" rx="3" fill="#880000"/>
  <rect x="136" y="288" width="68" height="12" rx="6" fill="#770000"/>

  <!-- ══════════════════════════════════════════════════════ -->
  <!--  MOUSE + CABLE                                       -->
  <!-- ══════════════════════════════════════════════════════ -->
  <path d="M 180 300 C 180 316, 200 320, 222 316 C 244 312, 258 320, 258 331
           C 258 340, 250 345, 242 343 C 234 341, 230 333, 229 325"
        fill="none" stroke="url(#gMouse)" stroke-width="4.5" stroke-linecap="round"/>
  <ellipse cx="246" cy="320" rx="22" ry="15" fill="url(#gMouse)" filter="url(#fDrop)"/>
  <line x1="246" y1="306" x2="246" y2="334" stroke="#c44d00" stroke-width="1.4" opacity="0.5"/>
  <ellipse cx="246" cy="315" rx="4" ry="5.5" fill="#ffe082" opacity="0.6"/>

  <!-- ══════════════════════════════════════════════════════ -->
  <!--  GRADUATION FIGURE                                   -->
  <!-- ══════════════════════════════════════════════════════ -->
  <!-- Head -->
  <circle cx="184" cy="118" r="17" fill="url(#gFig)" filter="url(#fDrop)"/>
  <!-- Torso -->
  <path d="M 176 133 C 169 151, 165 171, 166 187 C 166 197, 173 203, 181 203
           C 189 203, 197 197, 197 187 C 197 171, 193 151, 186 133 Z"
        fill="url(#gFig)"/>
  <!-- Left arm up toward globe -->
  <path d="M 176 139 C 167 126, 159 108, 156 91 C 154 80, 158 72, 163 74
           C 168 76, 169 88, 171 102 C 173 116, 175 128, 176 139 Z"
        fill="url(#gFig)"/>
  <!-- Right arm sweeping down -->
  <path d="M 186 141 C 197 154, 209 167, 213 179 C 216 189, 212 195, 207 194
           C 202 193, 199 185, 195 174 C 191 163, 188 152, 186 141 Z"
        fill="url(#gFig)"/>
  <!-- Legs -->
  <path d="M 174 200 C 171 218, 167 235, 165 252 C 163 261, 167 266, 172 266
           C 177 266, 181 261, 181 252 L 181 203 Z"
        fill="url(#gFig)" opacity="0.9"/>
  <path d="M 188 200 C 191 218, 195 235, 197 252 C 199 261, 195 266, 190 266
           C 185 266, 181 261, 181 252 L 181 203 Z"
        fill="url(#gFig)" opacity="0.9"/>

  <!-- ══════════════════════════════════════════════════════ -->
  <!--  GRADUATION CAP                                      -->
  <!-- ══════════════════════════════════════════════════════ -->
  <ellipse cx="184" cy="106" rx="25" ry="7.5" fill="#bb0000" filter="url(#fDrop)"/>
  <rect x="174" y="97"  width="20" height="11" rx="3" fill="#cc0000"/>
  <line x1="207" y1="106" x2="212" y2="119" stroke="#ffd740" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="213" cy="122" r="4" fill="#ffd740"/>

  <!-- ══════════════════════════════════════════════════════ -->
  <!--  GLOBE                                               -->
  <!-- ══════════════════════════════════════════════════════ -->
  <circle cx="158" cy="64" r="27" fill="url(#gGlobe)" filter="url(#fDrop)"/>
  <ellipse cx="158" cy="64" rx="27" ry="11" fill="none" stroke="white" stroke-width="1.2" opacity="0.42"/>
  <ellipse cx="158" cy="56" rx="21" ry="6.5" fill="none" stroke="white" stroke-width="0.9" opacity="0.28"/>
  <ellipse cx="158" cy="72" rx="21" ry="6.5" fill="none" stroke="white" stroke-width="0.9" opacity="0.28"/>
  <ellipse cx="158" cy="64" rx="13" ry="27" fill="none" stroke="white" stroke-width="1.2" opacity="0.42"/>
  <line x1="131" y1="64" x2="185" y2="64" stroke="white" stroke-width="1.1" opacity="0.38"/>
  <!-- Continents -->
  <path d="M 150 50 C 154 46, 163 47, 167 52 C 170 56, 166 61, 160 60
           C 155 59, 149 55, 150 50 Z" fill="white" opacity="0.52"/>
  <path d="M 148 65 C 150 62, 155 62, 156 65 C 157 68, 154 71, 151 70
           C 148 69, 147 67, 148 65 Z" fill="white" opacity="0.52"/>
  <path d="M 161 70 C 163 68, 167 69, 168 72 C 169 75, 166 77, 163 76
           C 160 75, 160 72, 161 70 Z" fill="white" opacity="0.45"/>
  <!-- Shine -->
  <ellipse cx="150" cy="55" rx="8" ry="6" fill="white" opacity="0.20" transform="rotate(-15 150 55)"/>

  <!-- ══════════════════════════════════════════════════════ -->
  <!--  TEXT — MASTER                                       -->
  <!--  Starts at x=270, font-size 118, ~680px wide total  -->
  <!-- ══════════════════════════════════════════════════════ -->
  <text
    x="268" y="212"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="118"
    font-weight="900"
    fill="url(#gRed)"
    letter-spacing="6"
    filter="url(#fText)">MASTER</text>

  <!-- Separator line under MASTER, spans full text width -->
  <rect x="268" y="220" width="804" height="4.5" rx="2" fill="#aa0000"/>

  <!-- ══════════════════════════════════════════════════════ -->
  <!--  TEXT — COMPUTER ACADEMY                             -->
  <!--  font-size 52, letter-spacing 4 → ~800px wide       -->
  <!-- ══════════════════════════════════════════════════════ -->
  <text
    x="272" y="274"
    font-family="'Arial Black', 'Impact', Arial, sans-serif"
    font-size="52"
    font-weight="900"
    fill="url(#gOrange)"
    letter-spacing="6"
    filter="url(#fText)">COMPUTER ACADEMY</text>

  <!-- ══════════════════════════════════════════════════════ -->
  <!--  TAGLINE — LEARN  |  PRACTICE  |  GROW               -->
  <!--  Everything positioned to stay within 268–1072       -->
  <!-- ══════════════════════════════════════════════════════ -->
  <!-- Left rule -->
  <line x1="268" y1="305" x2="356" y2="305" stroke="#444" stroke-width="1.8"/>
  <!-- Right rule -->
  <line x1="718" y1="305" x2="1072" y2="305" stroke="#444" stroke-width="1.8"/>

  <text x="364" y="310"
        font-family="Arial, 'Helvetica Neue', sans-serif"
        font-size="22" font-weight="700" fill="#333" letter-spacing="5">LEARN</text>

  <!-- Pipe 1 — after LEARN -->
  <line x1="450" y1="294" x2="450" y2="316" stroke="#cc1100" stroke-width="2.2"/>

  <text x="460" y="310"
        font-family="Arial, 'Helvetica Neue', sans-serif"
        font-size="22" font-weight="700" fill="#333" letter-spacing="5">PRACTICE</text>

  <!-- Pipe 2 — after PRACTICE -->
  <line x1="610" y1="294" x2="610" y2="316" stroke="#cc1100" stroke-width="2.2"/>

  <text x="620" y="310"
        font-family="Arial, 'Helvetica Neue', sans-serif"
        font-size="22" font-weight="700" fill="#333" letter-spacing="5">GROW</text>

</svg>
